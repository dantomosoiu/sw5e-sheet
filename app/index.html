<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SW5E Character Sheet</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon192.png">
  <meta name="theme-color" content="#0f1218">
  <link rel="stylesheet" href="viewer.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="art/art.css">
  <link rel="stylesheet" href="fx.css">
  <link rel="stylesheet" href="info.css">
</head>
<body>
  <div class="theme-art" aria-hidden="true"></div>
  <div class="fx-layer" aria-hidden="true"><i class="fx-hp"></i><i class="fx-cond"></i><i class="fx-state"></i><i class="fx-motion"></i><i class="fx-pulse"></i></div>
  <a class="skip-link" href="#sheet">Skip to the sheet</a>
  <header class="topbar">
    <div class="brand"><img src="icons/icon32.png" alt=""><span class="emblem" aria-hidden="true"></span><span>SW5E Sheet</span></div>
    <label class="picker">
      <span class="sr-only">Character</span>
      <select id="charSelect" title="Choose a character"></select>
    </label>
    <div class="actions">
      <button id="btnLoad" class="btn primary needs-sw5e" title="Load all your characters from sw5e.com">Load from SW5E</button>
      <button id="btnImport" class="btn" title="Import a character JSON file (SW5E export or a sheet snapshot)">Import file…</button>
      <input id="fileInput" type="file" accept=".json,application/json" hidden multiple>
      <div class="menu">
        <button id="btnMore" class="btn" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu" title="More actions">More ▾</button>
        <div id="moreMenu" class="menu-pop" hidden>
          <button data-act="load" class="narrow-only needs-sw5e">Load from SW5E</button>
          <button data-act="import" class="mid-only">Import file…</button>
          <button data-act="from-sw5e" class="no-sw5e" title="Without the browser extension: a bookmark on sw5e.com sends your characters here">Get characters from sw5e.com…</button>
          <button data-act="cr-new">New character…</button>
          <hr class="mid-only">
          <button data-act="recompute" class="needs-sw5e" title="Ask sw5e.com for its own calculation of this character and compare it with the sheet’s">Check the numbers with sw5e.com</button>
          <button data-act="export-character" title="Everything this sheet keeps for this character: its data and your changes, play state, tweak reasons, effects, version history and recent rolls. Import the file to restore it.">Back up this character (.json)</button>
          <button data-act="export-backup" title="The same for every character in this browser, in one file.">Back up all characters (.json)</button>
          <button data-act="export-raw" title="The character in SW5E's own format, with your changes: for sw5e.com or other tools. Without play state, reasons, effects or history.">Export for sw5e.com (.json)</button>
          <button data-act="export-snapshot" title="sw5e.com's copy and the numbers its engine computed, without the changes made here: for checking numbers or reporting a problem.">Export SW5E's copy with its numbers (.json)</button>
          <button data-act="messages">Recent messages</button>
          <button data-act="explain" aria-pressed="false" title="Explain mode: a tap (or click) on anything shows what it is and why, instead of doing it">Explain mode ⓘ</button>
          <button data-act="guide" title="Roll, attack, take damage, use a feature, cast, use an item, rest: where each is">First session guide</button>
          <button data-act="rules-books" title="SW5E's books (the Player's Handbook and the others), kept with the sheet: read and search them, offline too">SW5E rules (the books)</button>
          <hr>
          <button data-act="expand-all">Expand all cards</button>
          <button data-act="collapse-all">Collapse all cards</button>
          <button data-act="toggle-compact" id="compactItem" aria-pressed="false" title="Show only card titles, counters and buttons; tap a card to read it">Compact cards</button>
          <hr>
          <button data-act="remove" class="danger" id="removeItem">Remove from this viewer</button>
        </div>
      </div>
    </div>
    <div id="status" class="status" role="status" aria-live="polite" title=""></div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Summary and sections"></aside>
    <main id="sheet" class="sheet" tabindex="-1"></main>
  </div>
  <button id="dicebtn" class="dice-fab" data-dice-toggle aria-expanded="false" aria-keyshortcuts="Shift+D" title="Dice roller (Shift + D), or click any number on the sheet"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="8.6" cy="8.6" r=".9"/><circle cx="15.4" cy="8.6" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="8.6" cy="15.4" r=".9"/><circle cx="15.4" cy="15.4" r=".9"/></svg><span class="sr-only">Dice roller</span></button>

  <!-- Storage and sw5e.com: the web version; the browser extension puts its own in place (dev/build.py). -->
  <script src="platform.js"></script>
  <script src="md.js"></script>
  <script src="sw5e.js"></script>
  <script src="sw5e-data.js"></script>
  <script src="effects.js"></script>
  <script src="classes.js"></script>
  <script src="choices.js"></script>
  <script src="powers.js"></script>
  <script src="progression.js"></script>
  <script src="play.js"></script>
  <script src="inventory.js"></script>
  <script src="engine.js"></script>
  <script src="roller.js"></script>
  <script src="builder.js"></script>
  <script src="art/names.js"></script>
  <script src="art.js"></script>
  <script src="icons.js"></script>
  <script src="viewer.js"></script>
  <script src="shortcuts.js"></script>
  <script src="info.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
