<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SW5E Character Sheet</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <a class="skip-link" href="#sheet">Skip to the sheet</a>
  <header class="topbar">
    <div class="brand"><img src="icons/icon32.png" alt=""><span>SW5E Sheet</span></div>
    <label class="picker">
      <span class="sr-only">Character</span>
      <select id="charSelect" title="Choose a character"></select>
    </label>
    <div class="actions">
      <button id="btnLoad" class="btn primary" title="Load all your characters from sw5e.com">Load from SW5E</button>
      <button id="btnImport" class="btn" title="Import a character JSON file (SW5E export or a sheet snapshot)">Import file…</button>
      <button id="dicebtn" class="btn" data-dice-toggle title="Dice roller (or click any number on the sheet)">🎲 Dice</button>
      <input id="fileInput" type="file" accept=".json,application/json" hidden multiple>
      <div class="menu">
        <button id="btnMore" class="btn" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu" title="More actions">More ▾</button>
        <div id="moreMenu" class="menu-pop" hidden>
          <button data-act="load" class="narrow-only">Load from SW5E</button>
          <button data-act="import" class="mid-only">Import file…</button>
          <button data-act="cr-new">New character…</button>
          <hr class="mid-only">
          <button data-act="recompute" title="Ask sw5e.com for its own calculation of this character and compare it with the sheet’s">Check the numbers with sw5e.com</button>
          <button data-act="export-character" title="Everything this sheet keeps for this character: its data and your changes, play state, tweak reasons, effects, version history and recent rolls. Import the file to restore it.">Back up this character (.json)</button>
          <button data-act="export-backup" title="The same for every character in this browser, in one file.">Back up all characters (.json)</button>
          <button data-act="export-raw" title="The character in SW5E's own format, with your changes: for sw5e.com or other tools. Without play state, reasons, effects or history.">Export for sw5e.com (.json)</button>
          <button data-act="export-snapshot" title="sw5e.com's copy and the numbers its engine computed, without the changes made here: for checking numbers or reporting a problem.">Export SW5E's copy with its numbers (.json)</button>
          <button data-act="messages">Recent messages</button>
          <button data-act="guide" title="Roll, attack, take damage, use a feature, cast, use an item, rest: where each is">First session guide</button>
          <hr>
          <button data-act="expand-all">Expand all cards</button>
          <button data-act="collapse-all">Collapse all cards</button>
          <button data-act="toggle-compact" id="compactItem" aria-pressed="false" title="Show only card titles, counters and buttons; tap a card to read it">Compact cards</button>
          <button data-act="theme">Switch light / dark</button>
          <hr>
          <button data-act="remove" class="danger" id="removeItem">Remove from this viewer</button>
        </div>
      </div>
    </div>
    <div id="status" class="status" role="status" aria-live="polite" title=""></div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Summary and sections"></aside>
    <main id="sheet" class="sheet" tabindex="-1"></main>
  </div>

  <script src="md.js"></script>
  <script src="bridge.js"></script>
  <script src="effects.js"></script>
  <script src="classes.js"></script>
  <script src="choices.js"></script>
  <script src="powers.js"></script>
  <script src="progression.js"></script>
  <script src="play.js"></script>
  <script src="inventory.js"></script>
  <script src="engine.js"></script>
  <script src="roller.js"></script>
  <script src="builder.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
